# Signs in and waits for the first post-login screen. Runs after `launch.yaml`.
#
# SETUP: replace the three ids with your own, and adjust for your auth flow
# (magic link, password, social). In the dev flavor the login call is usually
# mocked, so any well-formed address works — pass one with
# `env: { EMAIL: "..." }`.
appId: {{APP_ID}}
---
- tapOn:
    id: "login_email_field"
- inputText: "${EMAIL}"
- hideKeyboard:
    optional: true

- tapOn:
    id: "login_continue_button"

- extendedWaitUntil:
    visible:
      id: "home_todo_list"
    timeout: 20000
